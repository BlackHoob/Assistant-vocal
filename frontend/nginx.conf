server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sans ce fallback, un F5 sur /billets ou /admin/users renverrait un 404
    # Nginx au lieu de laisser React Router gérer la route côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets buildés (hashés par Vite, donc sûrs à cacher)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}