# Identifiant unique du projet dans SonarQube
sonar.projectKey=nestor-vocal
sonar.projectName=Nestor Vocal

# Dossiers de code source à analyser (adapte si ta structure diffère)
sonar.sources=backend/src,frontend/src

# Ce qu'il ne faut jamais analyser
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/uploads/**,**/*.test.ts,**/*.test.tsx

# Tests
sonar.tests=backend/src/tests
sonar.test.inclusions=**/*.test.ts

# Rapport de couverture Jest (voir étape 5 ci-dessous)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8